; Elecrow CrowPanel Advanced 10.1" ESP32-P4 + T-HMI-C64 emulator
[platformio]
src_dir = CrowPanel_C64

[env:crowpanel_p4]
platform = espressif32
board = esp32-p4_r3
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
lib_deps =
  symlink://T-HMI-C64
  bblanchon/ArduinoJson @ ^7.4.2
  https://github.com/esp-arduino-libs/esp-lib-utils.git
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
  https://github.com/ESP32Async/AsyncTCP.git
  https://github.com/ESP32Async/ESPAsyncWebServer.git
  https://github.com/devyte/ESPAsyncDNSServer.git
build_flags =
  -DBOARD_CROWPANEL_P4
  -DUSE_WEB_KEYBOARD
  -DESP32
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -IT-HMI-C64/src
  -IT-HMI-C64/src/display/crowpanel
lib_ldf_mode = deep+
